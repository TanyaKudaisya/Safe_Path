
spring.application.name=safepath-backend

# Database
spring.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/safepath}

# Server
server.port=${PORT:8080}

# Logging
logging.level.org.springframework.security=${SECURITY_LOG_LEVEL:INFO}

# JWT - MUST be configured outside Git
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:86400000}

# Cloudinary
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:}
cloudinary.api-key=${CLOUDINARY_API_KEY:}
cloudinary.api-secret=${CLOUDINARY_API_SECRET:}

# YOLO service
yolo.service-url=${YOLO_SERVICE_URL:http://localhost:9001}

# Upload limits
spring.servlet.multipart.max-file-size=15MB
spring.servlet.multipart.max-request-size=16MB

# Bootstrap administrator
admin.bootstrap.email=${ADMIN_BOOTSTRAP_EMAIL:admin@safepath.com}
admin.bootstrap.password=${ADMIN_BOOTSTRAP_PASSWORD}

# Password reset email (SMTP)
spring.mail.host=${MAIL_HOST:}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
mail.from=${MAIL_FROM:}

# Optional: enhanced Expo push security
# expo.push.access-token=${EXPO_PUSH_ACCESS_TOKEN:}
